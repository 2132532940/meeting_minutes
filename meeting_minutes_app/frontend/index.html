<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 会议纪要生成器 - 基于 VibeVoice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .drag-active {
            border-color: #3B82F6 !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
        }
        .segment-card {
            transition: all 0.2s ease;
        }
        .segment-card:hover {
            transform: translateX(4px);
        }
        .audio-player-custom {
            width: 100%;
            height: 40px;
        }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .processing-pulse {
            animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen transition-colors duration-300">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-microphone-alt text-3xl text-primary"></i>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900 dark:text-white">AI 会议纪要生成器</h1>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Powered by Microsoft VibeVoice ASR</p>
                    </div>
                </div>
                <button id="themeToggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                    <i class="fas fa-moon dark:hidden text-gray-700"></i>
                    <i class="fas fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Upload Section -->
        <section id="uploadSection" class="mb-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">
                    <i class="fas fa-upload mr-2 text-primary"></i>上传会议音频
                </h2>
                
                <!-- Drop Zone -->
                <div id="dropZone" class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-8 text-center cursor-pointer hover:border-primary transition-colors">
                    <input type="file" id="fileInput" accept="audio/*" class="hidden">
                    <i class="fas fa-cloud-upload-alt text-5xl text-gray-400 mb-4"></i>
                    <p class="text-lg text-gray-700 dark:text-gray-300 mb-2">
                        拖拽音频文件到此处，或点击选择文件
                    </p>
                    <p class="text-sm text-gray-500 dark:text-gray-400">
                        支持格式：MP3, WAV, M4A, FLAC, OGG | 最大时长：60 分钟
                    </p>
                </div>

                <!-- File Info -->
                <div id="fileInfo" class="hidden mt-4 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-lg">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <i class="fas fa-file-audio text-2xl text-primary"></i>
                            <div>
                                <p id="fileName" class="font-medium text-gray-900 dark:text-white"></p>
                                <p id="fileSize" class="text-sm text-gray-500 dark:text-gray-400"></p>
                            </div>
                        </div>
                        <button id="removeFile" class="text-red-500 hover:text-red-700">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>

                <!-- Context Input -->
                <div class="mt-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        <i class="fas fa-tags mr-1"></i>可选：专业术语/热词（提升识别准确率）
                    </label>
                    <textarea id="contextInfo" rows="2" 
                        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white"
                        placeholder="例如：人名、公司名、专业术语，用逗号分隔"></textarea>
                </div>

                <!-- Transcribe Button -->
                <button id="transcribeBtn" disabled
                    class="mt-4 w-full bg-primary hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center">
                    <i class="fas fa-play mr-2"></i>
                    开始转录
                </button>
            </div>
        </section>

        <!-- Processing Status -->
        <section id="processingSection" class="hidden mb-8">
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-circle-notch fa-spin text-3xl text-primary processing-pulse"></i>
                    <div class="flex-1">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white">正在处理中...</h3>
                        <p id="processingStatus" class="text-sm text-gray-500 dark:text-gray-400">正在分析音频内容</p>
                        <div class="mt-2 w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                            <div id="progressBar" class="bg-primary h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Results Section -->
        <section id="resultsSection" class="hidden">
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-lg p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-blue-100 text-sm">会议时长</p>
                            <p id="totalDuration" class="text-2xl font-bold">--:--</p>
                        </div>
                        <i class="fas fa-clock text-3xl opacity-50"></i>
                    </div>
                </div>
                <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-xl shadow-lg p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-green-100 text-sm">发言人数</p>
                            <p id="speakerCount" class="text-2xl font-bold">--</p>
                        </div>
                        <i class="fas fa-users text-3xl opacity-50"></i>
                    </div>
                </div>
                <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl shadow-lg p-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-purple-100 text-sm">处理时间</p>
                            <p id="processingTime" class="text-2xl font-bold">--</p>
                        </div>
                        <i class="fas fa-bolt text-3xl opacity-50"></i>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg mb-6">
                <div class="border-b border-gray-200 dark:border-gray-700">
                    <nav class="flex -mb-px">
                        <button data-tab="transcription" class="tab-btn flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm border-primary text-primary">
                            <i class="fas fa-align-left mr-2"></i>完整转录
                        </button>
                        <button data-tab="summary" class="tab-btn flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
                            <i class="fas fa-list-ul mr-2"></i>会议摘要
                        </button>
                        <button data-tab="export" class="tab-btn flex-1 py-4 px-1 text-center border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300">
                            <i class="fas fa-download mr-2"></i>导出
                        </button>
                    </nav>
                </div>

                <!-- Tab Content -->
                <div class="p-6">
                    <!-- Transcription Tab -->
                    <div id="transcriptionTab" class="tab-content">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
                                <i class="fas fa-comments mr-2 text-primary"></i>对话内容
                            </h3>
                            <button id="toggleAudioPlayer" class="text-sm text-primary hover:text-blue-700">
                                <i class="fas fa-volume-up mr-1"></i>显示音频播放器
                            </button>
                        </div>
                        
                        <!-- Audio Player (hidden by default) -->
                        <div id="audioPlayerContainer" class="hidden mb-4 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg">
                            <audio id="audioElement" controls class="w-full"></audio>
                        </div>

                        <!-- Segments -->
                        <div id="segmentsContainer" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                            <!-- Segments will be inserted here -->
                        </div>
                    </div>

                    <!-- Summary Tab -->
                    <div id="summaryTab" class="tab-content hidden">
                        <div class="space-y-6">
                            <!-- Key Points -->
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">
                                    <i class="fas fa-star mr-2 text-yellow-500"></i>关键要点
                                </h3>
                                <ul id="keyPointsList" class="space-y-2">
                                    <!-- Key points will be inserted here -->
                                </ul>
                            </div>

                            <!-- Action Items -->
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">
                                    <i class="fas fa-tasks mr-2 text-green-500"></i>待办事项
                                </h3>
                                <div id="actionItemsList" class="space-y-2">
                                    <!-- Action items will be inserted here -->
                                </div>
                            </div>

                            <!-- Speaker Stats -->
                            <div>
                                <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-3">
                                    <i class="fas fa-chart-pie mr-2 text-purple-500"></i>发言人统计
                                </h3>
                                <div id="speakerStats" class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <!-- Speaker stats will be inserted here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Export Tab -->
                    <div id="exportTab" class="tab-content hidden">
                        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">
                            <i class="fas fa-file-export mr-2 text-primary"></i>导出会议纪要
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <button onclick="exportToPDF()" class="p-4 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors text-left">
                                <i class="fas fa-file-pdf text-2xl text-red-500 mb-2"></i>
                                <p class="font-medium text-gray-900 dark:text-white">PDF 格式</p>
                                <p class="text-sm text-gray-500 dark:text-gray-400">适合打印和分享</p>
                            </button>
                            <button onclick="exportToWord()" class="p-4 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors text-left">
                                <i class="fas fa-file-word text-2xl text-blue-500 mb-2"></i>
                                <p class="font-medium text-gray-900 dark:text-white">Word 格式</p>
                                <p class="text-sm text-gray-500 dark:text-gray-400">可编辑文档</p>
                            </button>
                            <button onclick="exportToMarkdown()" class="p-4 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors text-left">
                                <i class="fab fa-markdown text-2xl text-gray-600 dark:text-gray-400 mb-2"></i>
                                <p class="font-medium text-gray-900 dark:text-white">Markdown</p>
                                <p class="text-sm text-gray-500 dark:text-gray-400">轻量级标记语言</p>
                            </button>
                            <button onclick="exportToJSON()" class="p-4 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-green-50 dark:hover:bg-green-900/20 transition-colors text-left">
                                <i class="fas fa-file-code text-2xl text-green-500 mb-2"></i>
                                <p class="font-medium text-gray-900 dark:text-white">JSON</p>
                                <p class="text-sm text-gray-500 dark:text-gray-400">结构化数据</p>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Error Section -->
        <section id="errorSection" class="hidden mb-8">
            <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-6">
                <div class="flex items-start space-x-3">
                    <i class="fas fa-exclamation-circle text-2xl text-red-500"></i>
                    <div>
                        <h3 class="text-lg font-semibold text-red-800 dark:text-red-200">处理失败</h3>
                        <p id="errorMessage" class="text-red-600 dark:text-red-300 mt-1"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="text-center text-sm text-gray-500 dark:text-gray-400">
                <p>基于 <a href="https://github.com/microsoft/VibeVoice" target="_blank" class="text-primary hover:underline">Microsoft VibeVoice ASR</a> 构建</p>
                <p class="mt-1">支持 50+ 语言 | 最长 60 分钟音频 | 自动说话人分离</p>
            </div>
        </div>
    </footer>

    <script>
        // State
        let currentFile = null;
        let transcriptionData = null;
        let audioUrl = null;
        const API_BASE_URL = 'http://localhost:8000';

        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFileBtn = document.getElementById('removeFile');
        const contextInfo = document.getElementById('contextInfo');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const processingSection = document.getElementById('processingSection');
        const processingStatus = document.getElementById('processingStatus');
        const progressBar = document.getElementById('progressBar');
        const resultsSection = document.getElementById('resultsSection');
        const errorSection = document.getElementById('errorSection');
        const errorMessage = document.getElementById('errorMessage');
        const themeToggle = document.getElementById('themeToggle');

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        // Check saved theme
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        // Drag and Drop
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                if (!file.type.startsWith('audio/')) {
                    showError('请上传音频文件');
                    return;
                }
                currentFile = file;
                showFileInfo(file);
            }
        }

        function showFileInfo(file) {
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.remove('hidden');
            transcribeBtn.disabled = false;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        removeFileBtn.addEventListener('click', () => {
            currentFile = null;
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            transcribeBtn.disabled = true;
        });

        // Transcribe
        transcribeBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            // Show processing section
            processingSection.classList.remove('hidden');
            resultsSection.classList.add('hidden');
            errorSection.classList.add('hidden');
            transcribeBtn.disabled = true;

            // Simulate progress
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress > 90) progress = 90;
                progressBar.style.width = `${progress}%`;
            }, 500);

            try {
                const formData = new FormData();
                formData.append('file', currentFile);
                if (contextInfo.value.trim()) {
                    formData.append('context_info', contextInfo.value.trim());
                }

                processingStatus.textContent = '正在上传音频文件...';
                
                const response = await fetch(`${API_BASE_URL}/transcribe`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '转录失败');
                }

                processingStatus.textContent = '正在解析结果...';
                progressBar.style.width = '95%';

                const result = await response.json();
                
                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                // Store result
                transcriptionData = result;
                
                // Create audio URL
                if (audioUrl) URL.revokeObjectURL(audioUrl);
                audioUrl = URL.createObjectURL(currentFile);

                // Display results
                displayResults(result);

                setTimeout(() => {
                    processingSection.classList.add('hidden');
                    resultsSection.classList.remove('hidden');
                }, 500);

            } catch (error) {
                clearInterval(progressInterval);
                processingSection.classList.add('hidden');
                showError(error.message);
            } finally {
                transcribeBtn.disabled = false;
            }
        });

        function displayResults(result) {
            // Update stats
            document.getElementById('totalDuration').textContent = formatDuration(result.audio_duration);
            const uniqueSpeakers = new Set(result.segments.map(s => s.speaker_id));
            document.getElementById('speakerCount').textContent = uniqueSpeakers.size;
            document.getElementById('processingTime').textContent = `${result.processing_time.toFixed(1)}s`;

            // Display segments
            const segmentsContainer = document.getElementById('segmentsContainer');
            segmentsContainer.innerHTML = result.segments.map((seg, index) => `
                <div class="segment-card bg-gray-50 dark:bg-gray-700 rounded-lg p-4 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600"
                     onclick="seekAudio(${seg.start_time})">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <div class="flex items-center space-x-2 mb-2">
                                <span class="px-2 py-1 bg-primary text-white text-xs rounded-full">${seg.speaker_id}</span>
                                <span class="text-xs text-gray-500 dark:text-gray-400">
                                    ${formatTimestamp(seg.start_time)} - ${formatTimestamp(seg.end_time)}
                                </span>
                            </div>
                            <p class="text-gray-800 dark:text-gray-200">${seg.text}</p>
                        </div>
                        <button class="ml-2 text-gray-400 hover:text-primary" onclick="event.stopPropagation(); playSegment(${seg.start_time}, ${seg.end_time})">
                            <i class="fas fa-play"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            // Set audio source
            document.getElementById('audioElement').src = audioUrl;

            // Generate summary (simple version)
            generateSummary(result.segments);
        }

        function generateSummary(segments) {
            // Key points (first few segments)
            const keyPointsList = document.getElementById('keyPointsList');
            const firstSegments = segments.slice(0, 5);
            keyPointsList.innerHTML = firstSegments.map(seg => `
                <li class="flex items-start space-x-2">
                    <i class="fas fa-check-circle text-green-500 mt-1"></i>
                    <span class="text-gray-700 dark:text-gray-300">${seg.text}</span>
                </li>
            `).join('');

            // Action items (heuristic)
            const actionVerbs = ['will', 'should', 'must', 'need', 'action', 'task'];
            const actionItems = segments.filter(seg => 
                actionVerbs.some(verb => seg.text.toLowerCase().includes(verb))
            ).slice(0, 5);
            
            const actionItemsList = document.getElementById('actionItemsList');
            if (actionItems.length > 0) {
                actionItemsList.innerHTML = actionItems.map(item => `
                    <div class="flex items-start space-x-2 p-3 bg-green-50 dark:bg-green-900/20 rounded-lg">
                        <i class="fas fa-square-check text-green-500 mt-1"></i>
                        <div>
                            <p class="text-gray-800 dark:text-gray-200">${item.text}</p>
                            <span class="text-xs text-gray-500 dark:text-gray-400">${item.speaker_id}</span>
                        </div>
                    </div>
                `).join('');
            } else {
                actionItemsList.innerHTML = '<p class="text-gray-500 dark:text-gray-400">未检测到明显的待办事项</p>';
            }

            // Speaker stats
            const speakerStats = {};
            segments.forEach(seg => {
                if (!speakerStats[seg.speaker_id]) {
                    speakerStats[seg.speaker_id] = { count: 0, duration: 0 };
                }
                speakerStats[seg.speaker_id].count++;
                speakerStats[seg.speaker_id].duration += seg.end_time - seg.start_time;
            });

            const speakerStatsDiv = document.getElementById('speakerStats');
            speakerStatsDiv.innerHTML = Object.entries(speakerStats).map(([speaker, stats]) => `
                <div class="p-4 bg-purple-50 dark:bg-purple-900/20 rounded-lg">
                    <div class="flex items-center justify-between mb-2">
                        <span class="font-medium text-gray-900 dark:text-white">${speaker}</span>
                        <span class="text-sm text-gray-500 dark:text-gray-400">${stats.count} 次发言</span>
                    </div>
                    <div class="text-sm text-gray-600 dark:text-gray-400">
                        总时长：${formatDuration(stats.duration)}
                    </div>
                </div>
            `).join('');
        }

        function seekAudio(time) {
            const audio = document.getElementById('audioElement');
            audio.currentTime = time;
            document.getElementById('audioPlayerContainer').classList.remove('hidden');
            audio.play();
        }

        function playSegment(start, end) {
            const audio = document.getElementById('audioElement');
            audio.currentTime = start;
            document.getElementById('audioPlayerContainer').classList.remove('hidden');
            audio.play();
            
            // Stop at end time
            const checkTime = () => {
                if (audio.currentTime >= end) {
                    audio.pause();
                    audio.removeEventListener('timeupdate', checkTime);
                }
            };
            audio.addEventListener('timeupdate', checkTime);
        }

        document.getElementById('toggleAudioPlayer').addEventListener('click', function() {
            const container = document.getElementById('audioPlayerContainer');
            container.classList.toggle('hidden');
            this.innerHTML = container.classList.contains('hidden') 
                ? '<i class="fas fa-volume-up mr-1"></i>显示音频播放器'
                : '<i class="fas fa-volume-mute mr-1"></i>隐藏音频播放器';
        });

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabName = btn.dataset.tab;
                
                // Update buttons
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('border-primary', 'text-primary');
                    b.classList.add('border-transparent', 'text-gray-500');
                });
                btn.classList.remove('border-transparent', 'text-gray-500');
                btn.classList.add('border-primary', 'text-primary');
                
                // Update content
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.add('hidden');
                });
                document.getElementById(`${tabName}Tab`).classList.remove('hidden');
            });
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorSection.classList.remove('hidden');
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatTimestamp(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Export functions
        function exportToPDF() {
            alert('PDF 导出功能需要集成 jsPDF 库，这里仅做演示');
            // Implementation would use jsPDF or html2pdf
        }

        function exportToWord() {
            alert('Word 导出功能需要后端支持，这里仅做演示');
        }

        function exportToMarkdown() {
            if (!transcriptionData) return;
            
            let md = '# 会议纪要\n\n';
            md += `**会议时长**: ${formatDuration(transcriptionData.audio_duration)}\n`;
            md += `**处理时间**: ${transcriptionData.processing_time.toFixed(1)}s\n\n`;
            md += '## 转录内容\n\n';
            
            transcriptionData.segments.forEach(seg => {
                md += `**[${formatTimestamp(seg.start_time)} - ${formatTimestamp(seg.end_time)}] ${seg.speaker_id}**\n\n`;
                md += `${seg.text}\n\n`;
            });
            
            downloadFile(md, 'meeting-minutes.md', 'text/markdown');
        }

        function exportToJSON() {
            if (!transcriptionData) return;
            const json = JSON.stringify(transcriptionData, null, 2);
            downloadFile(json, 'meeting-minutes.json', 'application/json');
        }

        function downloadFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
